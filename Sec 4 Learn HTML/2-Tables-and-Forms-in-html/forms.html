<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <form>
        <textarea name="message" placeholder="Enter your name"></textarea>
        <label for="email">Email:<input type="email" placeholder="Enter your email"></label>
        <label for="password"> Password:<input type="password" placeholder="Enter your password"></label>

        <button type="submit">Submit</button>
    </form>
    <div>
        <h2>Learning Form</h2>
        <form>
            <input type="checkbox" name="terms" id="terms">
            <input type="radio" name="gender" id="male">
            <label for="Games">Games
                <select name="games" id="games">
                    <option value="1">Cricket</option>
                    <option value="2">Football</option>
                    <option value="3">Tennis</option>
                    <option value="4">Basketball</option>
                    <option value="5">Hockey</option>
                    <option value="6">Volleyball</option>
                    <option value="7">Baseball</option>
                    <option value="8">Golf</option>
                    <option value="9">Tennis</option>
                    <option value="10">Basketball</option>
                </select>
            </label>
            <label for="month">Month
                <input type="month" name="month" id="month">
            </label>
            <label for="date">Date
                <input type="date" name="date" id="date">
            </label>
            <label for="time">Time
                <input type="time" name="time" id="time">
            </label>
        </form>
    </div>
</body>
</html>
